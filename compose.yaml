services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10s
  
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgrsql://db:5432/dashboard
      DB_USER: dev
      DB_PASSWORD: dev
    depends_on:
      db:
        condition: service_healthy
  
volumes:
  pdgata: